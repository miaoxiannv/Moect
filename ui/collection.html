<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Moect 资源归档</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#292137;font:14px 'HarmonyOS Sans SC','Microsoft YaHei UI',system-ui;line-height:1.6}header,main,footer{max-width:1000px;margin:auto;padding:25px}header{padding-bottom:12px}h1{font-size:25px;margin:0 0 7px}p{margin:7px 0}.muted{color:#7e718f;font-size:13px}.notice{padding:13px 16px;background:#eee8f7;border-radius:12px;color:#66537e;font-size:13px;margin:15px 0}input,select,button{font:inherit;background:#fff;color:inherit;border:1px solid #dfd5ed;border-radius:9px;padding:8px 12px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}#query{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}.card{background:#fff;border:1px solid #e6deef;border-radius:15px;padding:17px;overflow:hidden;overflow-wrap:anywhere}.sticker{text-align:center}.sticker img{width:100%;height:155px;object-fit:contain}.sticker .name{font-size:12px;margin-top:8px;color:#7e718f}.post{max-width:740px;margin:0 auto 20px}.post .body{white-space:pre-wrap;margin:13px 0}.post .media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:min(100%,408px)}.post .media .photo-link{display:block;aspect-ratio:1;overflow:hidden}.post .media .photo{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px;max-height:none}.post .media.single{display:block}.post .media.single .photo-link{aspect-ratio:auto}.post .media.single .photo{height:auto;max-height:480px;object-fit:contain}.post .media video{grid-column:1/-1}.post img,.post video{max-width:100%;max-height:440px;border-radius:10px;object-fit:contain}.tag{font-size:11px;color:#96711b;margin:5px 0}a{color:#7056c4;overflow-wrap:anywhere}.link{display:inline-flex;max-width:100%;padding:11px;background:#f5f1fb;border-radius:9px;text-decoration:none;margin-top:10px}footer{text-align:center}footer button{margin:0 10px}#status{padding:8px 0}.downloads{display:flex;gap:16px;margin-top:12px;font-size:12px}@media(max-width:600px){header,main,footer{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
[hidden]{display:none!important}.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#7e718f}.filters{align-items:end}.post-author{font-weight:600;margin-right:9px;color:#66537e}
.post-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}.person-avatar{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:7px;background:#e8dff8;color:#725c90;overflow:hidden;font-size:13px}.person-avatar img{display:block;width:100%;height:100%;object-fit:cover}.social{margin-top:14px;background:#f4f1f7;border-radius:9px;padding:0 12px}.social details+details{border-top:1px solid #e6dfed}.social summary{cursor:pointer;padding:10px 0;font-size:12px;color:#78668d;user-select:none}.like-avatars{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}.like-person{border:0;background:none;padding:0}.like-name{font-size:12px;padding:0 0 10px;color:#7056a0}.comment{display:flex;gap:9px;padding:0 0 13px}.comment-copy{min-width:0;flex:1}.comment-by{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px;color:#746387}.comment-time{font-size:11px;color:#9b91a8;margin-left:auto}.comment-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px;font-size:13px}.post .body{margin-top:0}.post .post-author{color:#705c8d}
.post img.comment-media{display:block;max-width:140px;max-height:140px;object-fit:contain;margin-top:6px;border-radius:5px}</style>
<header><h1 id="title"></h1><p class="muted" id="meta"></p><p class="notice" id="notice"></p><div class="filters"><input id="query" type="search" placeholder="搜索内容或表情名称"><select id="group" aria-label="表情分类"></select><div id="time-filter"><moect-date-range id="date-range"></moect-date-range></div><input id="start" type="hidden"><input id="end" type="hidden"><button id="reset">显示全部</button><button id="print">打印 / 保存 PDF</button></div><p class="muted" id="status" role="status"></p><div class="downloads"><a href="data.json" download>下载归档 JSON</a><a href="resource-report.jsonl" download>资源明细</a></div></header><main id="items"></main><footer><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer>
<script>__DATE_RANGE_PICKER__</script>
<script>__ARCHIVE_PRINT__</script>
<script>__ARCHIVE_MEDIA__</script>
<script src="builtin-faces.js"></script>
<script>__INLINE_FACES__</script>
<script>
const data=__COLLECTION__,size=60,$=s=>document.querySelector(s);let page=0;
const sticker=data.category==='stickers';$('#title').textContent=data.name;document.title=data.name+' · Moect';$('#notice').textContent=data.notice;
const summary=data.resource_summary||{};$('#meta').textContent=data.owner.name+' · '+data.items.length+(sticker?' 张表情':' 条朋友圈')+' · 已保存 '+(summary.available||0)+' 个资源 · 缺失 '+(summary.missing||0)+' · 跳过 '+(summary.skipped||0)+' · '+data.exported_at;
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=String(text);return el}
function local(value){if(typeof value!=='string')return '';let decoded;try{decoded=decodeURIComponent(value)}catch{return ''}return decoded.startsWith('/')||decoded.includes('\\')||/^[a-z]+:/i.test(decoded)||decoded.split('/').some(p=>p==='..'||p==='.')?'':value}
function url(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function anchor(parent,value,label,isLocal=false){const href=isLocal?local(value):url(value);if(!href)return null;const a=node('a','',label);a.href=href;a.target='_blank';a.rel='noopener noreferrer';parent.append(a);return a}
if(sticker){$('#time-filter').hidden=true;const all=node('option','','全部分类');all.value='';$('#group').append(all);for(const g of data.groups||[]){const el=node('option','',g.name+' · '+g.count);el.value=g.id;$('#group').append(el)}}else{const authors=new Map(data.items.map(item=>[item.author,item.author_name||item.author]));const all=node('option','','全部作者');all.value='';$('#group').append(all);$('#group').setAttribute('aria-label','朋友圈作者');for(const [uid,name] of authors){const option=node('option','',name+' · '+uid);option.value=uid;$('#group').append(option)}$('#group').hidden=authors.size<2;}
function personAvatar(person){const a=node('span','person-avatar',(person.name||person.uid||'?').slice(0,1));if(local(person.avatar)){const img=node('img');img.src=person.avatar;img.alt=person.name||person.uid||'';img.loading='lazy';img.onerror=()=>{img.remove();a.textContent=(person.name||person.uid||'?').slice(0,1)};a.replaceChildren(img)}return a}
function renderSocial(card,item){
 const likes=item.likes||[],comments=item.comments||[];if(!likes.length&&!comments.length)return;
 const social=node('div','social');
 if(likes.length){const section=node('details'),summary=node('summary','',likes.length+' 人点赞'),avatars=node('div','like-avatars'),name=node('div','like-name');name.hidden=true;section.open=true;section.append(summary,avatars,name);for(const person of likes){const button=node('button','like-person');button.type='button';button.title=person.name||person.uid;button.setAttribute('aria-label','查看点赞人 '+(person.name||person.uid));button.append(personAvatar(person));button.onclick=()=>{name.textContent=(person.name||person.uid)+(person.uid?' · '+person.uid:'');name.hidden=false;};avatars.append(button)}social.append(section)}
 if(comments.length){const section=node('details');section.open=true;section.append(node('summary','',comments.length+' 条评论'));for(const person of comments){const row=node('div','comment'),copy=node('div','comment-copy'),by=node('div','comment-by',person.name||person.uid),body=node('div','comment-text');by.title=person.uid||'';if(person.create_time)by.append(node('span','comment-time',new Date(person.create_time*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})));if(person.reply_name||person.reply_uid)body.append(node('span','post-author','回复 '+(person.reply_name||person.reply_uid)+'：'));MoectFaces.append(body,person.text||((person.resources||[]).length?'':'（非文字评论）'));for(const resource of person.resources||[]){if(resource.kind==='image'&&resource.status==='available'&&local(resource.path)){const img=node('img','comment-media');img.src=resource.path;img.alt='评论图片或表情';img.loading='lazy';const a=anchor(body,resource.path,'',true);if(a)a.append(img)}}copy.append(by,body);row.append(personAvatar(person),copy);section.append(row)}social.append(section)}card.append(social)
}
function matchesCollectionItem(p,f){return (!f.group||(f.sticker?p.group:p.author)===f.group)&&(!f.q||[p.text,p.name,p.title,p.description,p.author_name,p.author].filter(Boolean).join(' ').toLocaleLowerCase().includes(f.q))&&(f.from===null||p.create_time>=f.from)&&(f.to===null||p.create_time<=f.to)}
function collectionRows(){
 const start=$('#start').value,end=$('#end').value,q=$('#query').value.trim().toLocaleLowerCase(),group=$('#group').value;
 if(start&&end&&start>end)throw new Error('结束日期不能早于开始日期');
 const from=start?Date.parse((start.includes('T')?start:start+'T00:00')+':00+08:00')/1000:null,to=end?Date.parse((end.includes('T')?end:end+'T23:59')+':59+08:00')/1000:null;
 const rows=data.items.filter(p=>matchesCollectionItem(p,{group,q,from,to,sticker}));
 return rows;
}
function collectionCard(item){
  const card=node('article','card '+(sticker?'sticker':'post'));
  if(!sticker){const by=node('div','post-header'),copy=node('div','muted'),author=node('span','post-author',item.author_name||item.author||'');author.title=item.author||'';copy.append(author,node('div','',item.time_str||'时间未知'));by.append(personAvatar({name:item.author_name||item.author,avatar:item.author_avatar}),copy);card.append(by);if(item.text){const body=node('div','body');MoectFaces.append(body,item.text);card.append(body)}if(item.location)card.append(node('p','muted',item.location))}
  const media=node('div','media');let rendered=false;
  for(const r of item.resources||[]){if(r.status!=='available'||!local(r.path))continue;const image=r.kind==='image',el=node(image?'img':'video',!sticker&&image?'photo':'');el.src=r.path;if(image){el.loading='lazy';el.alt=sticker?item.name:'朋友圈图片';const a=anchor(media,r.path,'',true);if(a){a.className=sticker?'':'photo-link';a.append(el)}}else{el.controls=true;el.preload='metadata';media.append(el)}rendered=true;if(r.role==='thumbnail')card.append(node('div','tag','仅有缩略图，原文件尚不可用'))}
  if(!sticker&&(item.resources||[]).filter(r=>r.kind==='image'&&r.status==='available').length===1)media.classList.add('single');card.append(media);if(!sticker)renderSocial(card,item);if(sticker)card.append(node('div','name',item.name));
  if(item.status==='missing'||item.media_status?.includes('missing'))card.append(node('div','tag','部分资源未缓存或本地文件不可读取'));
  if(item.media_status?.includes('encrypted'))card.append(node('div','tag','本地图片已找到，但解密材料尚不可用。请在 Moect 恢复图片读取后重新导出。'));
  if(item.media_status?.includes('corrupt')||item.media_status?.includes('unsupported'))card.append(node('div','tag','部分本地媒体未通过完整解码或超过处理大小限制，详见资源明细。'));
  if(item.status==='unsupported')card.append(node('div','tag','此条内容的本地数据暂时无法解析'));
  if(item.media_status?.includes('skipped'))card.append(node('div','tag','部分媒体已按导出设置跳过'));
  if(!rendered&&sticker)card.append(node('p','tag','原图未能还原'));
  if(!sticker&&url(item.url)){const a=anchor(card,item.url,item.title||item.description||'查看分享链接');if(a)a.className='link'}
  return card;
}
function render(){
 let rows;try{rows=collectionRows()}catch(error){$('#status').textContent=error.message;return}
 page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));const box=$('#items');box.replaceChildren();box.className=sticker?'grid':'';
 for(const item of rows.slice(page*size,(page+1)*size))box.append(collectionCard(item));
 $('#status').textContent='匹配 '+rows.length+' / '+data.items.length;$('#page').textContent=(rows.length?page+1:0)+' / '+Math.max(1,Math.ceil(rows.length/size));$('#prev').disabled=page===0;$('#next').disabled=(page+1)*size>=rows.length;
}
async function printCollection(){
 if(MoectPrint.busy)return;
 try{
  const rows=collectionRows();
  await MoectPrint.print({title:data.name,
   description:[$('#meta').textContent,$('#start').value,$('#end').value,$('#group').selectedOptions[0]?.textContent,$('#query').value.trim()].filter(Boolean).join(' · '),
   render:root=>{
    const items=node('div',sticker?'grid':'');root.append(items);
    for(const item of rows)items.append(collectionCard(item));return rows.length;
   }});
 }catch(error){$('#status').textContent=error.message}
}
$('#print').onclick=printCollection;
$('#date-range').addEventListener('range-change',e=>{$('#start').value=e.detail.start;$('#end').value=e.detail.end;page=0;render()});
for(const id of ['#query','#group','#start','#end'])$(id).addEventListener(id==='#query'?'input':'change',()=>{page=0;render()});$('#reset').onclick=()=>{for(const id of ['#query','#group','#start','#end'])$(id).value='';$('#date-range').setAttribute('start','');$('#date-range').setAttribute('end','');page=0;render()};$('#prev').onclick=()=>{page--;render();scrollTo(0,0)};$('#next').onclick=()=>{page++;render();scrollTo(0,0)};render();
MoectMedia.mount(document.querySelector('#items'));
</script></html>
